<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:"Inter",sans-serif}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;background:#0a0a0a;color:#d4d4d8;padding:96px 88px;display:flex;flex-direction:column}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:54px 54px}
.glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(58,155,255,.30),rgba(2,98,216,0) 65%);right:-380px;top:-360px}
.glow.g2{background:radial-gradient(circle,rgba(212,175,55,.20),rgba(212,175,55,0) 65%);left:-420px;bottom:-420px;top:auto;right:auto}
.top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:18px;color:#fafafa;font-weight:700;font-size:30px;letter-spacing:.04em}
.brand img{width:64px;height:64px}
.pg{font-size:26px;color:#8a8a93;font-weight:600}
.body{position:relative;z-index:2;margin-top:auto;margin-bottom:auto}
h1{font-family:"Inter Display","Inter";color:#fafafa;font-size:104px;line-height:1.02;font-weight:800;letter-spacing:-.02em}
h1 .g{color:#e8c766}
h2{font-family:"Inter Display","Inter";color:#fafafa;font-size:76px;line-height:1.06;font-weight:800;letter-spacing:-.015em;margin-bottom:40px}
.num{font-family:"Inter Display";font-size:220px;line-height:.9;font-weight:800;color:transparent;-webkit-text-stroke:3px #e8c766;margin-bottom:28px}
.tag{display:inline-block;border:2px solid rgba(232,199,102,.5);color:#e8c766;border-radius:60px;padding:12px 28px;font-size:26px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:44px}
p{font-size:38px;line-height:1.42;color:#c4c4cc;max-width:860px}
.fix{margin-top:52px;display:flex;gap:24px;align-items:flex-start;background:rgba(58,155,255,.08);border:2px solid rgba(58,155,255,.35);border-radius:28px;padding:34px 38px}
.fix b{color:#3a9bff;font-size:30px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;padding-top:4px}
.fix span{font-size:34px;line-height:1.38;color:#fafafa}
.foot{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;font-size:28px;color:#8a8a93}
.swipe{color:#e8c766;font-weight:700;font-size:34px}
.cta{background:linear-gradient(135deg,#3a9bff,#0262d8);color:#fff;border-radius:80px;padding:30px 54px;font-size:40px;font-weight:700;display:inline-block;margin-top:56px}
.contact{margin-top:48px;font-size:34px;line-height:1.7;color:#fafafa}
.contact i{font-style:normal;color:#e8c766}
</style></head><body>
