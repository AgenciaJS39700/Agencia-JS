<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pedir cita</title>
<meta name="description" content="Pide cita online a cualquier hora y resuelve tus dudas con el asistente.">
<meta name="theme-color" content="#0f0f10">
<link rel="icon" href="/favicon.ico">
<!-- /asistentes/pagina.html — Página de citas de un cliente (se sirve en /c/SLUG). Para negocios sin web:
     se enlaza desde su ficha de Google, Instagram, WhatsApp o un QR en el mostrador. -->
<style>
:root{--c:#e8c766;--bg:#0f0f10;--tx:#fafafa;--mu:#a1a1aa;--ln:rgba(255,255,255,.1);--card:#17171a}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100dvh}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 40px}
.hero{position:relative;padding:28px 20px 24px;border-radius:24px;background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--c) 30%,transparent),transparent 60%),var(--card);border:1px solid var(--ln);overflow:hidden;text-align:center}
.logo{width:76px;height:76px;margin:0 auto 14px;border-radius:22px;display:grid;place-items:center;background:var(--c);color:#0a0a0a;overflow:hidden;box-shadow:0 12px 30px color-mix(in srgb,var(--c) 40%,transparent)}
.logo img{width:100%;height:100%;object-fit:cover}
h1{font-size:1.65rem;line-height:1.15;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--mu);margin:0 0 18px;font-size:.95rem}
.live{display:inline-flex;align-items:center;gap:.45rem;font-size:.8rem;color:#d4d4d8;background:rgba(255,255,255,.06);padding:.3rem .75rem;border-radius:999px;margin-bottom:16px}
.live:before{content:"";width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 #22c55e;animation:pl 2s infinite}
@keyframes pl{to{box-shadow:0 0 0 8px transparent}}
.btn{display:flex;align-items:center;justify-content:center;gap:.55rem;width:100%;min-height:54px;padding:.8rem 1.2rem;border-radius:16px;border:1px solid var(--ln);background:transparent;color:var(--tx);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;transition:transform .15s,border-color .2s}
.btn:hover{border-color:var(--c)}.btn:active{transform:scale(.98)}
.btn.main{background:var(--c);color:#0a0a0a;border-color:transparent;font-size:1.05rem}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.sec{margin-top:22px;padding:18px;border-radius:20px;background:var(--card);border:1px solid var(--ln)}
.sec h2{font-size:1rem;margin:0 0 10px;display:flex;align-items:center;gap:.5rem}
.sec p{margin:0;color:#d4d4d8}
.svc{list-style:none;margin:0;padding:0}
.svc li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--ln)}
.svc li:first-child{border-top:0}.svc small{color:var(--mu);white-space:nowrap}
.ico{width:18px;height:18px;flex:none;color:var(--c)}
form.anular{display:grid;gap:10px;margin-top:12px}
input{width:100%;min-height:48px;padding:.6rem .9rem;border-radius:12px;border:1px solid var(--ln);background:#0f0f10;color:var(--tx);font:inherit;font-size:16px}
.msg{margin-top:10px;font-size:.92rem}
.demo{margin:0 0 14px;padding:.6rem .9rem;border-radius:12px;background:rgba(255,255,255,.05);color:#d4d4d8;font-size:.82rem;text-align:center}
footer{margin-top:26px;text-align:center;color:#71717a;font-size:.78rem}
footer a{color:#a1a1aa}
.sk{height:300px;border-radius:24px;background:linear-gradient(90deg,#17171a,#1f1f23,#17171a);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.err{text-align:center;padding:60px 10px;color:var(--mu)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app" aria-busy="true"><div class="sk" aria-hidden="true"></div></main>
<script type="module">
import { abrirNegocio, svg } from "/asistentes/asistente.js";
const app = document.getElementById("app");
const slug = (location.pathname.match(/^\/c\/([a-z0-9-]{2,40})/) || [])[1];
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const I = {
  reloj: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  pin: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  lista: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  x: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15 9-6 6M9 9l6 6"/></svg>',
};
async function iniciar() {
  if (!slug) throw new Error();
  const r = await fetch(`/api/as/${slug}/config`);
  if (!r.ok) throw new Error();
  const c = await r.json(), n = c.negocio;
  document.title = `Pedir cita · ${n.nombre}`;
  document.documentElement.style.setProperty("--c", c.color);
  const tel = String(n.telefono || "").replace(/[^\d+]/g, "");
  const mapa = n.mapa || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(n.nombre + " " + n.direccion)}`;
  app.innerHTML = `
  ${c.demo ? '<p class="demo">Negocio ficticio de demostración (Agencia JS). La agenda es real: las citas se guardan.</p>' : ""}
  <section class="hero" aria-labelledby="t">
    <div class="logo">${n.logo ? `<img src="${esc(n.logo)}" alt="">` : svg(c.icono, 38)}</div>
    <h1 id="t">${esc(n.nombre)}</h1>
    <p class="sub">${esc(c.sector || "")}</p>
    <span class="live">Citas online las 24 horas</span>
    <button class="btn main" id="pedir" type="button">${svg("cal", 22)} Pedir cita</button>
    <div class="row">
      <button class="btn" id="duda" type="button">Tengo una duda</button>
      ${n.wa ? `<a class="btn" href="https://wa.me/${esc(n.wa)}?text=${encodeURIComponent("Hola, tengo una consulta")}" target="_blank" rel="noopener">WhatsApp</a>` : tel ? `<a class="btn" href="tel:${esc(tel)}">Llamar</a>` : ""}
    </div>
  </section>
  <section class="sec" aria-labelledby="s1"><h2 id="s1">${I.lista} Servicios</h2>
    <ul class="svc">${c.servicios.map((s) => `<li><span>${esc(s.nombre)}</span><small>${esc(s.precio)} · ${s.min} min</small></li>`).join("")}</ul></section>
  <section class="sec" aria-labelledby="s2"><h2 id="s2">${I.reloj} Horario</h2><p>${esc(n.horarioTexto)}</p></section>
  <section class="sec" aria-labelledby="s3"><h2 id="s3">${I.pin} Dónde estamos</h2><p>${esc(n.direccion)}</p>
    <div class="row"><a class="btn" href="${esc(mapa)}" target="_blank" rel="noopener">Cómo llegar</a>${tel ? `<a class="btn" href="tel:${esc(tel)}">Llamar</a>` : ""}</div>${n.web ? `<p style="margin-top:10px"><a href="${esc(n.web)}">Visitar la web</a></p>` : ""}</section>
  <section class="sec" id="anular" aria-labelledby="s4"><h2 id="s4">${I.x} Anular una cita</h2>
    <p>Escribe el código que te dimos al reservar y tu teléfono.</p>
    <form class="anular" novalidate>
      <label class="sr" for="cod" style="position:absolute;left:-9999px">Código</label><input id="cod" name="codigo" placeholder="Código (p. ej. K7M2Q9)" maxlength="8" autocomplete="off" autocapitalize="characters" required>
      <label for="tl" style="position:absolute;left:-9999px">Teléfono</label><input id="tl" name="telefono" type="tel" inputmode="tel" placeholder="Teléfono" maxlength="16" autocomplete="tel" required>
      <button class="btn" type="submit">Anular mi cita</button>
      <p class="msg" role="status" aria-live="polite"></p>
    </form></section>
  <footer>Asistente automático de citas · <a href="https://agencia-js.com/?utm_source=pagina-citas&utm_medium=referral#asistentes">Hecho por Agencia JS</a></footer>`;
  app.removeAttribute("aria-busy");
  const pedir = document.getElementById("pedir");
  const abrir = (b) => abrirNegocio(slug, { alCerrar: () => b.focus() }).catch(() => alertar());
  pedir.addEventListener("click", () => abrir(pedir));
  document.getElementById("duda").addEventListener("click", (e) => abrir(e.currentTarget));
  const f = app.querySelector("form.anular"), out = f.querySelector(".msg");
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    out.textContent = "Comprobando…";
    const r = await fetch(`/api/as/${slug}/anular`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ codigo: f.codigo.value, telefono: f.telefono.value }) }).catch(() => null);
    const d = r ? await r.json().catch(() => ({})) : {};
    out.textContent = d.mensaje || d.error || "No se pudo comprobar. Inténtalo de nuevo.";
    if (d.ok) f.reset();
  });
  if (location.hash === "#cita" || new URLSearchParams(location.search).has("cita")) abrir(pedir);
}
function alertar() { app.innerHTML = '<p class="err">No hemos podido cargar la página de citas. Recarga en un momento.</p>'; app.removeAttribute("aria-busy"); }
iniciar().catch(alertar);
</script>
</body>
</html>
